spring.application.name=freelancehub

# ---- Server (Railway injects PORT) ----
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Database (Railway MySQL plugin exposes MYSQLHOST/PORT/DATABASE/USER/PASSWORD) ----
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:freelancehub_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:freelancehub}
spring.datasource.password=${MYSQLPASSWORD:freelancehub}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- App ----
app.admin.email=${ADMIN_EMAIL:admin@freelancehub.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed-demo=${SEED_DEMO:true}
