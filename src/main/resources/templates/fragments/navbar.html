<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">FreelanceHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/projects}">Browse Projects</a></li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.client}">
                    <a class="nav-link" th:href="@{/client/dashboard}">Dashboard</a></li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.client}">
                    <a class="nav-link" th:href="@{/client/projects}">My Projects</a></li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.client}">
                    <a class="nav-link" th:href="@{/client/projects/new}">Post a Project</a></li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.freelancer}">
                    <a class="nav-link" th:href="@{/freelancer/dashboard}">My Bids</a></li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.admin}">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.admin}">
                    <a class="nav-link" th:href="@{/admin/users}">Users</a></li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.admin}">
                    <a class="nav-link" th:href="@{/admin/categories}">Categories</a></li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="nav-link" th:href="@{/login}">Login</a></li>
                <li class="nav-item" th:if="${currentUser == null}">
                    <a class="btn btn-light btn-sm ms-lg-2" th:href="@{/register}">Sign up</a></li>
                <li class="nav-item" th:if="${currentUser != null}">
                    <a class="nav-link" th:href="@{/profile}">
                        <span th:text="${currentUser.name}">User</span>
                        <span class="badge bg-light text-dark ms-1" th:text="${currentUser.role}">ROLE</span>
                    </a></li>
                <li class="nav-item" th:if="${currentUser != null}">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm ms-lg-2">Logout</button>
                    </form></li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
