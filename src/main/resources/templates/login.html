<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Login - FreelanceHub</title></head>
<body>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm"><div class="card-body p-4">
                <h3 class="mb-3">Log in</h3>
                <div class="alert alert-info" th:if="${param.required}">Please log in to continue.</div>
                <div class="alert alert-success" th:if="${param.loggedout}">You have been logged out.</div>
                <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" name="email" th:value="${email}" required autofocus>
                        <div class="invalid-feedback">Enter a valid email address.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" type="password" id="password" name="password" required>
                        <div class="invalid-feedback">Password is required.</div>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Log in</button>
                </form>
                <p class="text-center mt-3 mb-0">No account? <a th:href="@{/register}">Sign up</a></p>
            </div></div>
        </div>
    </div>
</main>
</body>
</html>
