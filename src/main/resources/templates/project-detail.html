<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title th:text="${project.title} + ' - FreelanceHub'">Project</title></head>
<body>
<main class="container py-3">
    <a th:href="@{/projects}" class="text-decoration-none">&larr; All projects</a>
    <div class="card shadow-sm mt-2"><div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <h2 class="mb-1" th:text="${project.title}">Title</h2>
            <span th:replace="~{fragments/components :: statusBadge(${project.status})}"></span>
        </div>
        <p class="text-muted mb-3">
            <span class="badge bg-light text-dark border" th:text="${project.category.name}">Category</span>
            posted by <strong th:text="${project.client.name}">client</strong>
            on <span th:text="${#temporals.format(project.createdAt, 'dd MMM yyyy')}">date</span>
        </p>
        <p style="white-space: pre-line" th:text="${project.description}">Description</p>
        <hr>
        <div class="row text-center g-3">
            <div class="col-md-4"><div class="text-muted small">Budget</div>
                <div class="h4">&#8377;<span th:text="${#numbers.formatDecimal(project.budget, 1, 'COMMA', 2, 'POINT')}">0</span></div></div>
            <div class="col-md-4"><div class="text-muted small">Deadline</div>
                <div class="h4" th:text="${#temporals.format(project.deadline, 'dd MMM yyyy')}">date</div></div>
            <div class="col-md-4"><div class="text-muted small">Bids received</div>
                <div class="h4" th:text="${bidCount}">0</div></div>
        </div>
        <hr>
        <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-primary" th:if="${canBid}" th:href="@{/projects/{id}/bid(id=${project.id})}">Submit a bid</a>
            <span class="badge bg-info text-dark align-self-center" th:if="${alreadyBid}">You have already bid on this project</span>
            <a class="btn btn-outline-primary" th:if="${owner}" th:href="@{/client/projects/{id}/bids(id=${project.id})}">View bids</a>
            <a class="btn btn-outline-secondary" th:if="${currentUser == null and project.open}" th:href="@{/login}">Log in to bid</a>
        </div>
    </div></div>

    <div class="card shadow-sm mt-3" th:if="${review != null}"><div class="card-body">
        <h5>Client review</h5>
        <div><span th:replace="~{fragments/components :: stars(${review.rating})}"></span>
            <span class="text-muted small">for <span th:text="${review.reviewee.name}">freelancer</span></span></div>
        <p class="mb-0" th:if="${review.comment != null}" th:text="${review.comment}">comment</p>
    </div></div>
</main>
</body>
</html>
