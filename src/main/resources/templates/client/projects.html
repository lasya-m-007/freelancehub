<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>My Projects - FreelanceHub</title></head>
<body>
<main class="container py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">My Projects</h3>
        <a class="btn btn-primary" th:href="@{/client/projects/new}">+ Post a project</a>
    </div>
    <div class="alert alert-light border" th:if="${projects.isEmpty()}">Nothing here yet. Post your first project!</div>
    <div class="table-responsive shadow-sm" th:if="${!projects.isEmpty()}">
        <table class="table align-middle mb-0">
            <thead><tr><th>Title</th><th>Category</th><th>Budget</th><th>Deadline</th><th>Status</th><th>Bids</th><th class="text-end">Actions</th></tr></thead>
            <tbody>
            <tr th:each="p : ${projects}">
                <td><a th:href="@{/projects/{id}(id=${p.id})}" th:text="${p.title}" class="text-decoration-none">title</a></td>
                <td th:text="${p.category.name}">cat</td>
                <td>&#8377;<span th:text="${#numbers.formatDecimal(p.budget, 1, 'COMMA', 2, 'POINT')}">0</span></td>
                <td th:text="${#temporals.format(p.deadline, 'dd MMM yyyy')}">date</td>
                <td><span th:replace="~{fragments/components :: statusBadge(${p.status})}"></span></td>
                <td th:text="${bidCounts.getOrDefault(p.id, 0L)}">0</td>
                <td class="text-end">
                    <div class="d-inline-flex gap-1 flex-wrap justify-content-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/client/projects/{id}/bids(id=${p.id})}">Bids</a>
                        <form th:if="${p.inProgress}" th:action="@{/client/projects/{id}/complete(id=${p.id})}" method="post"
                              data-confirm="Mark this project as complete?">
                            <button class="btn btn-sm btn-success" type="submit">Complete</button></form>
                        <a class="btn btn-sm btn-outline-warning" th:if="${p.completed}"
                           th:href="@{/client/projects/{id}/review(id=${p.id})}">Review</a>
                        <form th:if="${p.open}" th:action="@{/client/projects/{id}/close(id=${p.id})}" method="post"
                              data-confirm="Close this project? All pending bids will be rejected.">
                            <button class="btn btn-sm btn-outline-secondary" type="submit">Close</button></form>
                        <form th:if="${p.open or p.closed}" th:action="@{/client/projects/{id}/delete(id=${p.id})}" method="post"
                              data-confirm="Delete this project permanently?">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button></form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
