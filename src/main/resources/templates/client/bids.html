<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Bids - FreelanceHub</title></head>
<body>
<main class="container py-3">
    <a th:href="@{/client/projects}" class="text-decoration-none">&larr; My projects</a>
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mt-2 mb-3">
        <div>
            <h3 class="mb-1" th:text="${project.title}">Project</h3>
            <span th:replace="~{fragments/components :: statusBadge(${project.status})}"></span>
            <span class="text-muted ms-2">Budget &#8377;<span th:text="${#numbers.formatDecimal(project.budget, 1, 'COMMA', 2, 'POINT')}">0</span></span>
        </div>
        <div class="d-flex gap-2">
            <form th:if="${project.inProgress}" th:action="@{/client/projects/{id}/complete(id=${project.id})}" method="post"
                  data-confirm="Mark this project as complete?">
                <button class="btn btn-success" type="submit">Mark complete</button></form>
            <a class="btn btn-warning" th:if="${project.completed and review == null}"
               th:href="@{/client/projects/{id}/review(id=${project.id})}">Leave a review</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${review != null}">
        Reviewed: <span th:replace="~{fragments/components :: stars(${review.rating})}"></span>
    </div>

    <div class="alert alert-light border" th:if="${bids.isEmpty()}">No bids yet.</div>
    <div class="table-responsive shadow-sm" th:if="${!bids.isEmpty()}">
        <table class="table align-middle mb-0">
            <thead><tr><th>Freelancer</th><th>Rating</th><th>Amount</th><th>Message</th><th>Status</th><th class="text-end">Action</th></tr></thead>
            <tbody>
            <tr th:each="b : ${bids}">
                <td th:text="${b.freelancer.name}">name</td>
                <td>
                    <span th:if="${b.freelancer.ratingCount > 0}">
                        <span th:text="${#numbers.formatDecimal(b.freelancer.averageRating, 1, 2)}">0</span>
                        <span class="rating-star">&#9733;</span>
                        <span class="text-muted small">(<span th:text="${b.freelancer.ratingCount}">0</span>)</span>
                    </span>
                    <span th:if="${b.freelancer.ratingCount == 0}" class="text-muted small">New</span>
                </td>
                <td>&#8377;<span th:text="${#numbers.formatDecimal(b.amount, 1, 'COMMA', 2, 'POINT')}">0</span></td>
                <td style="max-width: 320px; white-space: pre-line" th:text="${b.message}">message</td>
                <td><span th:replace="~{fragments/components :: statusBadge(${b.status})}"></span></td>
                <td class="text-end">
                    <form th:if="${project.open and b.pending}" th:action="@{/client/bids/{id}/accept(id=${b.id})}" method="post"
                          data-confirm="Accept this bid? All other bids will be rejected.">
                        <button class="btn btn-sm btn-success" type="submit">Accept</button></form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
