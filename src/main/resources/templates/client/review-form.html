<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Leave a Review - FreelanceHub</title></head>
<body>
<main class="container py-3">
    <div class="row justify-content-center"><div class="col-md-6">
        <div class="card shadow-sm"><div class="card-body p-4">
            <h3>Review the freelancer</h3>
            <p class="text-muted">
                Project: <strong th:text="${project.title}">title</strong><br>
                <span th:if="${freelancer != null}">Freelancer: <strong th:text="${freelancer.name}">name</strong></span>
            </p>
            <form th:action="@{/client/projects/{id}/review(id=${project.id})}" method="post" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="rating">Rating</label>
                    <select class="form-select" id="rating" name="rating" required>
                        <option value="">Choose...</option>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Average</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Terrible</option>
                    </select>
                    <div class="invalid-feedback">Please choose a rating.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="comment">Comment (optional)</label>
                    <textarea class="form-control" id="comment" name="comment" rows="4" maxlength="1000"></textarea>
                </div>
                <button class="btn btn-primary" type="submit">Submit review</button>
                <a class="btn btn-link" th:href="@{/client/projects}">Later</a>
            </form>
        </div></div>
    </div></div>
</main>
</body>
</html>
