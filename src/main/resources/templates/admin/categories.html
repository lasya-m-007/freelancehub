<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Manage Categories - FreelanceHub</title></head>
<body>
<main class="container py-3">
    <h3 class="mb-3">Manage Categories</h3>
    <form th:action="@{/admin/categories}" method="post" class="row g-2 mb-4 needs-validation" novalidate>
        <div class="col-sm-8 col-md-6">
            <input class="form-control" name="name" maxlength="80" placeholder="New category name" required>
            <div class="invalid-feedback">Enter a name.</div>
        </div>
        <div class="col-auto"><button class="btn btn-primary" type="submit">Add category</button></div>
    </form>
    <div class="table-responsive shadow-sm">
        <table class="table align-middle mb-0">
            <thead><tr><th>#</th><th>Name</th><th class="text-end">Action</th></tr></thead>
            <tbody>
            <tr th:each="c : ${categories}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}">name</td>
                <td class="text-end">
                    <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"
                          data-confirm="Delete this category?">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button></form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
