<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Browse Projects - FreelanceHub</title></head>
<body>
<main class="container py-3">
    <h3 class="mb-3">Browse Projects</h3>

    <form th:action="@{/projects}" method="get" class="card card-body shadow-sm mb-4">
        <div class="row g-2">
            <div class="col-md-3">
                <input class="form-control" name="keyword" placeholder="Keyword" th:value="${f.keyword}">
            </div>
            <div class="col-md-2">
                <select class="form-select" name="categoryId">
                    <option value="">All categories</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${f.categoryId != null and f.categoryId == c.id}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <input class="form-control" type="number" min="0" step="1" name="minBudget" placeholder="Min budget" th:value="${f.minBudget}">
            </div>
            <div class="col-md-2">
                <input class="form-control" type="number" min="0" step="1" name="maxBudget" placeholder="Max budget" th:value="${f.maxBudget}">
            </div>
            <div class="col-md-2">
                <select class="form-select" name="status">
                    <option value="OPEN" th:selected="${f.status == 'OPEN'}">Open</option>
                    <option value="IN_PROGRESS" th:selected="${f.status == 'IN_PROGRESS'}">In progress</option>
                    <option value="COMPLETED" th:selected="${f.status == 'COMPLETED'}">Completed</option>
                    <option value="ALL" th:selected="${f.status == 'ALL'}">All</option>
                </select>
            </div>
            <div class="col-md-1 d-grid">
                <button class="btn btn-primary" type="submit">Go</button>
            </div>
        </div>
    </form>

    <div class="alert alert-light border" th:if="${projects.isEmpty()}">No projects match your filters.</div>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="p : ${projects}">
            <div th:replace="~{fragments/components :: projectCard(${p}, ${bidCounts.getOrDefault(p.id, 0L)})}"></div>
        </div>
    </div>
</main>
</body>
</html>
